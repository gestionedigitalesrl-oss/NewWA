<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>WA Form — Privacar Trieste</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <style>
    :root {
      --brand: #18bfa3;
      --brand-dark: #10957f;
      --bg: #eef5f3;
      --card: rgba(255,255,255,.94);
      --text: #17201f;
      --muted: #6c7775;
      --border: #dbe5e2;
      --focus: rgba(24,191,163,.18);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 10px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(24,191,163,.18), transparent 32%),
        radial-gradient(circle at 90% 90%, rgba(16,149,127,.14), transparent 34%),
        var(--bg);
    }

    .card {
      width: min(100%, 720px);
      background: var(--card);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: var(--radius);
      box-shadow: 0 24px 70px rgba(30,55,50,.14);
      padding: 20px 26px;
      backdrop-filter: blur(12px);
    }

    header { margin-bottom: 14px; }
    h1 { margin: 0 0 4px; font-size: clamp(21px, 3vw, 27px); letter-spacing: -.03em; }
    .subtitle { margin: 0; color: var(--muted); font-size: 13px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field { display: flex; flex-direction: column; gap: 7px; }
    .field.full { grid-column: 1 / -1; }

    label, legend {
      font-size: 12px;
      font-weight: 650;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
      padding: 9px 11px;
      outline: none;
      transition: border-color .18s, box-shadow .18s;
    }

    input:focus, textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px var(--focus);
    }

    .phone {
      display: grid;
      grid-template-columns: 105px 1fr;
      gap: 8px;
    }

    fieldset {
      border: 0;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .choice {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fff;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
    }

    .choice input { width: auto; margin: 0; accent-color: var(--brand); }

    textarea {
      min-height: 175px;
      resize: vertical;
      line-height: 1.35;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
    }

    .status {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 10px 20px;
      background: var(--brand);
      color: white;
      font: 700 14px/1 inherit;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(24,191,163,.22);
      transition: transform .15s, background .15s;
    }

    button:hover { background: var(--brand-dark); transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    @media (max-width: 600px) {
      body { padding: 6px; }
      .card { padding: 14px 12px; }
      .grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .actions { align-items: stretch; flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>

<body>
  <main class="card">
    <header>
      <h1>Invio WhatsApp</h1>
      <p class="subtitle">Privacar Trieste · prepara il messaggio e apri WhatsApp Web.</p>
    </header>

    <form id="waForm" novalidate>
      <div class="grid">
        <div class="field">
          <label for="pref">Prefisso</label>
          <input id="pref" name="pref" type="tel" inputmode="tel" value="+39" autocomplete="tel-country-code">
        </div>

        <div class="field">
          <label for="numero">Numero di telefono</label>
          <input id="numero" name="numero" type="tel" inputmode="tel" autocomplete="tel" placeholder="3331234567" required>
        </div>

        <div class="field">
          <fieldset>
            <legend>Veicolo</legend>
            <label class="choice"><input type="radio" name="prom" value="Auto" checked> Auto</label>
            <label class="choice"><input type="radio" name="prom" value="Moto"> Moto</label>
          </fieldset>
        </div>

        <div class="field">
          <fieldset>
            <legend>Tipo di contatto</legend>
            <label class="choice"><input id="RIC" type="checkbox" name="richiamare"> Richiamare</label>
          </fieldset>
        </div>

        <div class="field full">
          <label for="testo">Messaggio</label>
          <textarea id="testo" name="testo" required></textarea>
        </div>
      </div>

      <div class="actions">
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <button type="submit">Apri WhatsApp</button>
      </div>
    </form>
  </main>

  <script>
    (() => {
      const form = document.querySelector("#waForm");
      const numero = document.querySelector("#numero");
      const pref = document.querySelector("#pref");
      const testo = document.querySelector("#testo");
      const richiamare = document.querySelector("#RIC");
      const status = document.querySelector("#status");

      const links = {
        Auto: "https://www.privacar.com/scheda-agenzia/29/trieste",
        Moto: "https://www.privabike.com"
      };

      const getParams = () => new URLSearchParams(window.location.search);

      function getVehicle() {
        return document.querySelector('input[name="prom"]:checked')?.value || "Auto";
      }

      function updateMessage() {
        const vehicle = getVehicle();
        const link = links[vehicle];

        if (richiamare.checked) {
          testo.value =
`Salve, le scrivo da Privacar Trieste in merito all'annuncio della sua ${vehicle},
la contatterò telefonicamente per spiegarle il nostro servizio.
Nel frattempo le indico di seguito il link al nostro sito web se volesse già approfondire:
${link}

-----------------------------------------------------
La nostra sede è situata all'interno del Centro Commerciale Montedoro.`;
        } else {
          testo.value =
`Salve,
le scrivo da Privacar Trieste. Possiamo aiutarla a trovare l'acquirente per la sua ${vehicle} tramite
i nostri servizi esclusivi e facendole ricavare il valore richiesto.
Ci contatti al numero 040.0646582 per ulteriori informazioni.
-----------------------------------------------------
${link}
La nostra sede è situata all'interno del Centro Commerciale Montedoro.`;
        }
      }

      document.querySelectorAll('input[name="prom"], #RIC')
        .forEach(el => el.addEventListener("change", updateMessage));

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const phone = numero.value.trim().replace(/[^\d]/g, "");
        const country = pref.value.trim().replace(/[^\d+]/g, "");
        const message = testo.value.trim();

        if (!phone) {
          status.textContent = "Inserisci il numero di telefono.";
          numero.focus();
          return;
        }

        if (!message) {
          status.textContent = "Inserisci il testo del messaggio.";
          testo.focus();
          return;
        }

        const fullPhone = `${country}${phone}`.replace(/^\+/, "");
        const url = `https://web.whatsapp.com/send?phone=${encodeURIComponent(fullPhone)}&text=${encodeURIComponent(message)}`;

        status.textContent = "Apertura di WhatsApp Web…";
        window.open(url, "_blank", "noopener,noreferrer");
      });

      // Mantiene la compatibilità con il vecchio parametro ?CELLNUM=...
      const cellnum = getParams().get("CELLNUM");
      if (cellnum) numero.value = cellnum;

      // Mantiene il comportamento iniziale del vecchio form.
      if (!testo.value.trim()) updateMessage();
    })();
  </script>
</body>
</html>
