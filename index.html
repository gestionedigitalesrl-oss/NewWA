<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>WA Form — Privacar Trieste</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    :root {
      --brand: #18bfa3;
      --brand-dark: #10957f;
      --bg: #eef5f3;
      --card: rgba(255,255,255,.94);
      --text: #17201f;
      --muted: #6c7775;
      --border: #dbe5e2;
      --focus: rgba(24,191,163,.18);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 10px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(24,191,163,.18), transparent 32%),
        radial-gradient(circle at 90% 90%, rgba(16,149,127,.14), transparent 34%),
        var(--bg);
    }

    .card {
      width: min(100%, 660px);
      background: var(--card);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: var(--radius);
      box-shadow: 0 24px 70px rgba(30,55,50,.14);
      padding: 20px 26px;
      backdrop-filter: blur(12px);
    }

    header { margin-bottom: 14px; }
    h1 { margin: 0 0 4px; font-size: clamp(21px, 3vw, 27px); letter-spacing: -.03em; }
    .subtitle { margin: 0; color: var(--muted); font-size: 13px; }

    .meta {
      margin-top: 12px;
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }

    .controls-row {
      display: grid;
      grid-template-columns: 85px 145px auto auto;
      gap: 12px;
      align-items: end;
      margin-bottom: 12px;
    }

    .field { display: flex; flex-direction: column; gap: 7px; }
    .field.full { width: 100%; }

    .extra-options {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }

    label, legend {
      font-size: 12px;
      font-weight: 650;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
      padding: 9px 11px;
      outline: none;
      transition: border-color .18s, box-shadow .18s;
    }

    #pref {
      width: 85px;
      padding-left: 11px;
      padding-right: 8px;
      text-align: left;
    }

    #numero {
      width: 145px;
    }

    input:focus, textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px var(--focus);
    }

    fieldset {
      border: 0;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
    }

    .choice {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fff;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      white-space: nowrap;
    }

    .choice input { width: auto; margin: 0; accent-color: var(--brand); }

    textarea {
      min-height: 245px;
      resize: vertical;
      line-height: 1.35;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
    }

    .status {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 10px 20px;
      background: var(--brand);
      color: white;
      font: 700 14px/1 inherit;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(24,191,163,.22);
      transition: transform .15s, background .15s;
    }

    button:hover { background: var(--brand-dark); transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    @media (max-width: 680px) {
      body { padding: 6px; }
      .card { padding: 14px 12px; }
      .controls-row {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      #pref, #numero { width: 100%; }
      .actions { align-items: stretch; flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>

<body>
  <main class="card">
    <header>
      <h1>Invio WhatsApp</h1>
      <p class="subtitle">Privacar Trieste · prepara il messaggio e apri WhatsApp Web.</p>
    </header>

    <form id="waForm" novalidate>
      <div class="controls-row">
        <!-- 1. Prefisso -->
        <div class="field">
          <label for="pref">Prefisso</label>
          <input id="pref" name="pref" type="tel" inputmode="tel" value="+39" maxlength="7" size="7" autocomplete="tel-country-code">
        </div>
        <!-- Test VERSIONE-->
        <!-- 2. Numero di telefono -->
        <div class="field">
          <label for="numero">Numero di telefono</label>
          <input id="numero" name="numero" type="tel" inputmode="tel" maxlength="10" size="10" autocomplete="tel" required>
        </div>

        <!-- 3. Tipo di contatto -->
        <div class="field">
          <fieldset>
            <legend>Tipo di contatto</legend>
            <label class="choice"><input id="RIC" type="checkbox" name="richiamare"> Richiamare</label>
          </fieldset>
        </div>

        <!-- 4. Veicolo -->
        <div class="field">
          <fieldset>
            <legend>Veicolo</legend>
            <label class="choice"><input type="radio" name="prom" value="Auto" checked> Auto</label>
            <label class="choice"><input type="radio" name="prom" value="Moto"> Moto</label>
          </fieldset>
        </div>
      </div>

      <div class="field full">
        <label for="testo">Messaggio</label>
        <textarea id="testo" name="testo" required></textarea>
        <!-- Flag Messaggio al di sotto della box -->
        <div class="extra-options">
          <label class="choice">
            <input id="flagMessaggio" type="checkbox" name="flagMessaggio"> Messaggio
          </label>
        </div>
      </div>

      <div class="actions">
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <button type="submit">Apri WhatsApp</button>
      </div>
    </form>
    <footer class="meta">
      Versione 1.0.1 · <time id="buildDate"></time>
    </footer>
  </main>

  <script>
    (() => {
      const buildDate = document.querySelector("#buildDate");
      const today = new Date();
      buildDate.dateTime = today.toISOString().slice(0, 10);
      buildDate.textContent = new Intl.DateTimeFormat("it-IT", { dateStyle: "long" }).format(today);

      const form = document.querySelector("#waForm");
      const numero = document.querySelector("#numero");
      const pref = document.querySelector("#pref");
      const testo = document.querySelector("#testo");
      const richiamare = document.querySelector("#RIC");
      const flagMessaggio = document.querySelector("#flagMessaggio");
      const status = document.querySelector("#status");

      numero.addEventListener("input", () => {
        numero.value = numero.value.replace(/\D/g, "").slice(0, 10);
      });

      pref.addEventListener("input", () => {
        pref.value = pref.value.slice(0, 7);
      });

      const links = {
        Auto: "https://www.privacar.com/scheda-agenzia/29/trieste",
        Moto: "https://www.privabike.com"
      };

      const getParams = () => new URLSearchParams(window.location.search);

      function getVehicle() {
        return document.querySelector('input[name="prom"]:checked')?.value || "Auto";
      }

      function updateMessage() {
        const vehicle = getVehicle();
        const link = links[vehicle];

        if (richiamare.checked) {
          testo.value =
`Salve, le scrivo da Privacar Trieste in merito all'annuncio della sua ${vehicle},
la contatterò telefonicamente per spiegarle il nostro servizio.
Nel frattempo le indico di seguito il link al nostro sito web se volesse già approfondire:
${link}

-----------------------------------------------------
La nostra sede è situata all'interno del Centro Commerciale Montedoro.`;
        } else {
          const fraseExtra = flagMessaggio.checked
            ? "\nPossiamo aiutarla a trovare l'acquirente per la sua Auto tramite\ni nostri servizi esclusivi e facendole ricavare il valore richiesto.\n"
            : "\n";

          testo.value =
`Salve,
le scrivo da Privacar Trieste.${fraseExtra} \nCi contatti al numero 040.0646582 per ulteriori informazioni.
-----------------------------------------------------
${link}
La nostra sede è situata all'interno del Centro Commerciale Montedoro.`;
        }
      }

      document.querySelectorAll('input[name="prom"], #RIC, #flagMessaggio')
        .forEach(el => el.addEventListener("change", updateMessage));

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const phone = numero.value.trim().replace(/[^\d]/g, "");
        const country = pref.value.trim().replace(/[^\d+]/g, "");
        const message = testo.value.trim();

        if (!phone) {
          status.textContent = "Inserisci il numero di telefono.";
          numero.focus();
          return;
        }

        if (!message) {
          status.textContent = "Inserisci il testo del messaggio.";
          testo.focus();
          return;
        }

        const fullPhone = `${country}${phone}`.replace(/^\+/, "");
        const url = `https://web.whatsapp.com/send?phone=${encodeURIComponent(fullPhone)}&text=${encodeURIComponent(message)}`;

        status.textContent = "Apertura di WhatsApp Web…";
        window.open(url, "_blank", "noopener,noreferrer");
      });

      // Gestione parametri URL (es. ?CELLNUM=3401234567 o ?CELLNUM=+393401234567)
      const params = getParams();
      const cellnum = params.get("CELLNUM") || params.get("cellnum");
      const countryParam = params.get("PREF") || params.get("pref");

      if (countryParam) {
        pref.value = countryParam.trim().slice(0, 7);
      }

      if (cellnum) {
        // Rimuove caratteri non numerici
        let clean = cellnum.replace(/\D/g, "");
        
        // Se inizia con il prefisso italiano '39' ed è più lungo di 10 cifre, rimuove il 39
        if (clean.length > 10 && clean.startsWith("39")) {
          clean = clean.substring(2);
        }
        
        // Limita a max 10 cifre
        numero.value = clean.slice(-10);
      }

      if (!testo.value.trim()) updateMessage();
    })();
  </script>
</body>
</html>
